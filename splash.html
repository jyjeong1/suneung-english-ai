<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google" content="notranslate">
<title>Prof.AI 수능영어</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  background:#0a0014;color:#fff;
  height:100vh;width:100vw;overflow:hidden;
  display:flex;justify-content:center;align-items:center;
  cursor:pointer;
}

/* 배경 파티클 */
.bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;}
.particle{
  position:absolute;border-radius:50%;
  animation:float linear infinite;
  opacity:0;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(-20vh) scale(1);opacity:0;}
}

/* 광선 효과 */
.glow{
  position:fixed;top:50%;left:50%;
  width:600px;height:600px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(123,45,142,0.3) 0%,rgba(74,0,51,0.1) 40%,transparent 70%);
  z-index:0;
  animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.5;}
  50%{transform:translate(-50%,-50%) scale(1.3);opacity:0.8;}
}

/* 회전 링 */
.ring{
  position:fixed;top:50%;left:50%;
  width:300px;height:300px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,215,0,0.1);
  border-radius:50%;
  z-index:0;
  animation:spin 20s linear infinite;
}
.ring2{
  width:450px;height:450px;
  border-color:rgba(123,45,142,0.15);
  animation:spin 30s linear infinite reverse;
}
.ring3{
  width:200px;height:200px;
  border-color:rgba(255,215,0,0.08);
  animation:spin 15s linear infinite;
}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}

.container{text-align:center;padding:40px 28px;max-width:500px;position:relative;z-index:10;}

/* 텍스트 */
.line{
  opacity:0;transform:translateY(30px);
  transition:opacity 1s ease-out, transform 1s ease-out;
}
.line.show{opacity:1;transform:translateY(0);}

.line1{
  font-size:20px;font-weight:300;line-height:1.8;
  color:rgba(255,255,255,0.7);
  text-shadow:0 0 20px rgba(255,255,255,0.1);
}
.line2{
  font-size:26px;font-weight:900;line-height:1.6;
  margin-top:24px;
  background:linear-gradient(135deg,#ffd700,#ffaa00,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 20px rgba(255,215,0,0.3));
}

.brand{
  opacity:0;transform:scale(0.6);
  transition:opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.34,1.56,0.64,1);
  margin-top:44px;
}
.brand.show{opacity:1;transform:scale(1);}
.brand-name{
  font-size:52px;font-weight:900;letter-spacing:-2px;
  background:linear-gradient(135deg,#ffd700,#fff,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(255,215,0,0.4));
  animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{
  0%,100%{filter:drop-shadow(0 0 20px rgba(255,215,0,0.3));}
  50%{filter:drop-shadow(0 0 40px rgba(255,215,0,0.6));}
}
.brand-sub{
  font-size:16px;font-weight:500;
  color:rgba(255,255,255,0.5);margin-top:8px;
  letter-spacing:8px;
}

.line3{
  font-size:14px;color:rgba(255,255,255,0.3);
  margin-top:40px;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:0.3;}50%{opacity:0.7;}}

/* 하단 프로그레스 바 */
.progress{
  position:fixed;bottom:0;left:0;height:3px;
  background:linear-gradient(90deg,#ffd700,#ff6b00);
  z-index:20;
  animation:loading 7s linear forwards;
}
@keyframes loading{from{width:0;}to{width:100%;}}
</style>
</head>
<body onclick="goLanding()">

<!-- 배경 효과 -->
<div class="bg" id="bg"></div>
<div class="glow"></div>
<div class="ring"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<!-- 콘텐츠 -->
<div class="container">
  <div class="line line1" id="l1">아직도 인쇄된 문제집으로<br>공부하고 있나요?</div>
  <div class="line line2" id="l2">나에게 맞는 AI 맞춤 문제로<br>실력을 빠르게 업그레이드하세요</div>
  <div class="brand" id="brand">
    <div class="brand-name">Prof.AI</div>
    <div class="brand-sub">수능영어</div>
  </div>
  <div class="line line3" id="l3">화면을 탭하세요</div>
</div>

<!-- 프로그레스 바 -->
<div class="progress"></div>

<script>
// 파티클 생성
const bg = document.getElementById('bg');
for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 4 + 1;
  const isGold = Math.random() > 0.6;
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + '%';
  p.style.background = isGold
    ? `rgba(255,215,0,${Math.random()*0.5+0.2})`
    : `rgba(123,45,142,${Math.random()*0.4+0.1})`;
  p.style.animationDuration = (Math.random() * 8 + 6) + 's';
  p.style.animationDelay = (Math.random() * 5) + 's';
  p.style.boxShadow = isGold ? '0 0 6px rgba(255,215,0,0.4)' : '0 0 4px rgba(123,45,142,0.3)';
  bg.appendChild(p);
}

// 순차 애니메이션
let step = 0;
setTimeout(() => document.getElementById('l1').classList.add('show'), 500);
setTimeout(() => document.getElementById('l2').classList.add('show'), 2000);
setTimeout(() => document.getElementById('brand').classList.add('show'), 3500);
setTimeout(() => { document.getElementById('l3').classList.add('show'); step = 1; }, 5000);

function goLanding() {
  if (step < 1) return;
  document.body.style.transition = 'opacity 0.6s';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = '/landing.html'; }, 600);
}

// 7초 후 자동 이동
setTimeout(() => { if (step >= 1) goLanding(); }, 8000);
</script>
</body>
</html>
