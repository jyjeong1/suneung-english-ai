<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능영어AI — 관리자 대시보드</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: #f0f2f5;
  color: #111;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}
h1 { font-size: 24px; margin-bottom: 8px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
.login-box { text-align:center; padding:60px 20px; }
.login-box button {
  background: #4285f4; color: #fff; border: none; padding: 12px 32px;
  border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600;
}
.summary-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.summary-card {
  flex: 1; min-width: 150px; background: #fff; border-radius: 12px;
  padding: 20px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.summary-card h3 { font-size: 13px; color: #666; margin-bottom: 6px; }
.summary-card .num { font-size: 32px; font-weight: 700; color: #0055d4; }
.summary-card .num.green { color: #1a8f3c; }
.summary-card .num.orange { color: #e65100; }
table {
  width: 100%; background: #fff; border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-collapse: collapse;
  overflow: hidden;
}
th { background: #f5f5f5; padding: 12px 16px; text-align: left; font-size: 13px; color: #666; font-weight: 600; }
td { padding: 12px 16px; border-top: 1px solid #eee; font-size: 13px; }
tr:hover td { background: #f9f9ff; }
.streak-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 600;
}
.streak-100 { background: #fff3e0; color: #e65100; }
.streak-30 { background: #e8f5e9; color: #1a8f3c; }
.streak-7 { background: #e3f2fd; color: #1565c0; }
.streak-0 { background: #f5f5f5; color: #999; }
.refresh-btn {
  background: #0055d4; color: #fff; border: none; padding: 8px 20px;
  border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 16px;
}
.filter-bar { display:flex; gap:12px; margin-bottom:16px; align-items:center; }
.filter-bar select, .filter-bar input {
  padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px;
}
</style>
</head>
<body>

<h1>📊 수능영어AI 관리자 대시보드</h1>
<p class="subtitle">사용자 학습 현황 모니터링</p>

<div id="loginArea" class="login-box">
  <p style="margin-bottom:16px; color:#666;">관리자 Google 계정으로 로그인하세요</p>
  <button onclick="adminLogin()">🔐 Google 로그인</button>
</div>

<div id="dashboard" style="display:none;">
  <div class="summary-row">
    <div class="summary-card">
      <h3>총 사용자</h3>
      <div class="num" id="totalUsers">0</div>
    </div>
    <div class="summary-card">
      <h3>오늘 활동</h3>
      <div class="num green" id="todayActive">0</div>
    </div>
    <div class="summary-card">
      <h3>100일+ 연속</h3>
      <div class="num orange" id="streak100">0</div>
    </div>
    <div class="summary-card">
      <h3>전체 평균 정답률</h3>
      <div class="num" id="avgAccuracy">0%</div>
    </div>
  </div>

  <div class="filter-bar">
    <button class="refresh-btn" onclick="loadUsers()">🔄 새로고침</button>
    <select id="sortBy" onchange="renderTable()">
      <option value="streak">연속일수 순</option>
      <option value="total">총 문제수 순</option>
      <option value="accuracy">정답률 순</option>
      <option value="recent">최근 활동 순</option>
    </select>
    <select id="filterStreak" onchange="renderTable()">
      <option value="all">전체</option>
      <option value="100">100일+ 연속</option>
      <option value="30">30일+ 연속</option>
      <option value="7">7일+ 연속</option>
    </select>
    <input type="text" id="searchName" placeholder="이름 검색..." oninput="renderTable()">
  </div>

  <!-- 공지/갤러리 관리 -->
  <div style="background:#fff; border-radius:12px; padding:24px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:24px;">
    <h2 style="font-size:18px; margin-bottom:16px;">📢 공지 & 사진 관리</h2>
    <div style="display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
      <select id="postType" style="padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px;">
        <option value="notice">📢 공지</option>
        <option value="photo">📷 사진</option>
        <option value="tip">💡 학습 팁</option>
        <option value="motivation">🔥 동기부여</option>
      </select>
      <input type="text" id="postTitle" placeholder="제목" style="flex:1; min-width:200px; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px;">
    </div>
    <textarea id="postContent" placeholder="내용을 입력하세요..." style="width:100%; height:80px; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:13px; resize:vertical; margin-bottom:12px;"></textarea>
    <input type="text" id="postImage" placeholder="이미지 URL (선택사항)" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px; margin-bottom:12px;">
    <div style="display:flex; gap:8px;">
      <button class="refresh-btn" onclick="submitPost()">✏️ 게시하기</button>
      <button class="refresh-btn" style="background:#666;" onclick="loadPosts()">🔄 새로고침</button>
    </div>
    <div id="postList" style="margin-top:16px;"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>이름</th>
        <th>이메일</th>
        <th>연속 학습</th>
        <th>총 문제</th>
        <th>정답률</th>
        <th>오늘</th>
        <th>마지막 활동</th>
        <th>멤버십</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDv_ArdZ39TyXFIsbV8CaEhYuF3w_zvbVU",
  authDomain: "suneung-english-34283.firebaseapp.com",
  projectId: "suneung-english-34283",
  storageBucket: "suneung-english-34283.firebasestorage.app",
  messagingSenderId: "436457100278",
  appId: "1:436457100278:web:dac0755eb8fedbdd512dd7",
  measurementId: "G-R7D94KDJYN"
};

let db, auth;
if (firebaseConfig.apiKey) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

let allUsers = [];

async function adminLogin() {
  if (!auth) return alert('Firebase 설정이 필요합니다');
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadUsers();
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') alert('로그인 실패: ' + e.message);
  }
}

auth && auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadUsers();
  }
});

async function loadUsers() {
  if (!db) return;
  try {
    const snapshot = await db.collection('users').get();
    allUsers = [];
    const today = new Date().toISOString().slice(0, 10);

    snapshot.forEach(doc => {
      const d = doc.data();
      const acc = d.stats?.total > 0 ? Math.round(d.stats.correct / d.stats.total * 100) : 0;
      allUsers.push({
        id: doc.id,
        name: d.displayName || '(이름없음)',
        email: d.email || '',
        streak: d.streak || 0,
        total: d.stats?.total || 0,
        correct: d.stats?.correct || 0,
        accuracy: acc,
        todayTotal: d.todayTotal || 0,
        todayCorrect: d.todayCorrect || 0,
        lastDate: d.lastDate || '',
        updatedAt: d.updatedAt?.toDate?.() || null,
        isToday: d.lastDate === today,
        isPremium: d.isPremium || false,
      });
    });

    // 요약 카드 업데이트
    document.getElementById('totalUsers').textContent = allUsers.length;
    document.getElementById('todayActive').textContent = allUsers.filter(u => u.isToday).length;
    document.getElementById('streak100').textContent = allUsers.filter(u => u.streak >= 100).length;
    const totalAcc = allUsers.length > 0
      ? Math.round(allUsers.reduce((s,u) => s + u.accuracy, 0) / allUsers.length) : 0;
    document.getElementById('avgAccuracy').textContent = totalAcc + '%';

    renderTable();
  } catch(e) {
    alert('데이터 로드 실패: ' + e.message);
  }
}

function renderTable() {
  const sortBy = document.getElementById('sortBy').value;
  const filterStreak = document.getElementById('filterStreak').value;
  const search = document.getElementById('searchName').value.toLowerCase();

  let users = [...allUsers];

  // 필터
  if (filterStreak !== 'all') {
    const min = parseInt(filterStreak);
    users = users.filter(u => u.streak >= min);
  }
  if (search) {
    users = users.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
  }

  // 정렬
  if (sortBy === 'streak') users.sort((a,b) => b.streak - a.streak);
  else if (sortBy === 'total') users.sort((a,b) => b.total - a.total);
  else if (sortBy === 'accuracy') users.sort((a,b) => b.accuracy - a.accuracy);
  else if (sortBy === 'recent') users.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));

  const tbody = document.getElementById('userTable');
  tbody.innerHTML = users.map((u, i) => {
    let streakClass = 'streak-0';
    if (u.streak >= 100) streakClass = 'streak-100';
    else if (u.streak >= 30) streakClass = 'streak-30';
    else if (u.streak >= 7) streakClass = 'streak-7';

    const todayInfo = u.isToday
      ? `${u.todayTotal}문제 (${u.todayTotal > 0 ? Math.round(u.todayCorrect/u.todayTotal*100) : 0}%)`
      : '<span style="color:#999;">—</span>';

    return `<tr>
      <td>${i+1}</td>
      <td><strong>${u.name}</strong></td>
      <td style="color:#666;">${u.email}</td>
      <td><span class="streak-badge ${streakClass}">🔥 ${u.streak}일</span></td>
      <td>${u.total}</td>
      <td style="font-weight:600; color:${u.accuracy >= 70 ? '#1a8f3c' : u.accuracy >= 50 ? '#e65100' : '#d32f2f'};">${u.accuracy}%</td>
      <td>${todayInfo}</td>
      <td style="color:#666;">${u.lastDate || '—'}</td>
      <td><button onclick="togglePremium('${u.id}', ${!u.isPremium})" style="font-size:11px; padding:3px 8px; border:1px solid #ddd; border-radius:6px; cursor:pointer; background:${u.isPremium ? '#fff3e0' : '#f5f5f5'};">${u.isPremium ? '💎' : '무료'}</button></td>
    </tr>`;
  }).join('');
}

async function togglePremium(uid, isPremium) {
  if (!confirm(isPremium ? '프리미엄으로 전환하시겠습니까?' : '무료로 전환하시겠습니까?')) return;
  await db.collection('users').doc(uid).update({ isPremium });
  loadUsers();
}

// ═══ 공지 & 사진 관리 ═══
async function submitPost() {
  if (!db) return alert('Firebase 연결 필요');
  const type = document.getElementById('postType').value;
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  const image = document.getElementById('postImage').value.trim();

  if (!title) return alert('제목을 입력하세요');

  const typeEmoji = {notice:'📢', photo:'📷', tip:'💡', motivation:'🔥'};
  try {
    await db.collection('posts').add({
      type,
      typeEmoji: typeEmoji[type],
      title,
      content,
      image: image || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      active: true,
    });
    document.getElementById('postTitle').value = '';
    document.getElementById('postContent').value = '';
    document.getElementById('postImage').value = '';
    alert('게시 완료!');
    loadPosts();
  } catch(e) {
    alert('게시 실패: ' + e.message);
  }
}

async function loadPosts() {
  if (!db) return;
  try {
    const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').limit(20).get();
    const listDiv = document.getElementById('postList');
    if (snapshot.empty) {
      listDiv.innerHTML = '<p style="color:#999; text-align:center; padding:16px;">등록된 게시물이 없습니다</p>';
      return;
    }
    listDiv.innerHTML = snapshot.docs.map(doc => {
      const d = doc.data();
      const date = d.createdAt?.toDate?.()?.toLocaleDateString('ko-KR') || '';
      return `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #eee;">
        <div>
          <span style="font-size:13px;">${d.typeEmoji} <strong>${d.title}</strong></span>
          ${d.image ? ' 🖼️' : ''}
          <span style="font-size:11px; color:#999; margin-left:8px;">${date}</span>
        </div>
        <div style="display:flex; gap:6px;">
          <button onclick="togglePost('${doc.id}', ${!d.active})" style="font-size:11px; padding:4px 10px; border:1px solid #ddd; border-radius:6px; cursor:pointer; background:${d.active ? '#e8f5e9' : '#ffebee'};">${d.active ? '✅ 활성' : '❌ 비활성'}</button>
          <button onclick="deletePost('${doc.id}')" style="font-size:11px; padding:4px 10px; border:1px solid #ddd; border-radius:6px; cursor:pointer; background:#ffebee; color:#d32f2f;">삭제</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    console.warn('게시물 로드 실패:', e);
  }
}

async function togglePost(id, active) {
  await db.collection('posts').doc(id).update({ active });
  loadPosts();
}

async function deletePost(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await db.collection('posts').doc(id).delete();
  loadPosts();
}

// 대시보드 로드 시 게시물도 로드
const origOnAuth = auth?.onAuthStateChanged;
auth && auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadUsers();
    loadPosts();
  }
});
</script>
</body>
</html>
