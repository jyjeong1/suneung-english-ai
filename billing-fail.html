<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prof.AI 정기결제 등록 실패</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #0a0f1a; color: #e0e5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { text-align: center; max-width: 400px; padding: 40px 30px; }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 22px; color: #f87171; margin-bottom: 12px; }
  p { font-size: 14px; color: #8b95b0; line-height: 1.7; margin-bottom: 20px; }
  .error-detail { font-size: 12px; color: #666; margin-bottom: 20px; }
  .btn { display: inline-block; background: rgba(255,255,255,0.1); color: #fff; padding: 14px 36px; border-radius: 14px; font-size: 16px; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">😔</div>
  <h1>정기결제 등록이 취소되었습니다</h1>
  <p>결제 등록 중 문제가 발생했거나 취소하셨습니다.<br>다시 시도하시거나, 무료 버전을 계속 이용하실 수 있습니다.</p>
  <div class="error-detail" id="errorDetail"></div>
  <a href="/" class="btn">돌아가기</a>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const msg = params.get('message');
  if (code || msg) {
    document.getElementById('errorDetail').textContent = (code || '') + ': ' + (msg || '');
  }
</script>
</body>
</html>
