<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prof.AI 수능영어 — 문제은행</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#0a0f1a;color:#e0e0e0;max-width:960px;margin:0 auto;padding:20px}
h1{font-size:24px;font-weight:900;color:#0055d4;margin-bottom:8px}
.summary{font-size:13px;color:#888;margin-bottom:24px}

/* 목차 */
.toc{background:rgba(255,255,255,0.03);border:1px solid rgba(0,85,212,0.2);border-radius:12px;padding:16px;margin-bottom:24px}
.toc h2{font-size:16px;margin-bottom:10px;color:#0055d4}
.toc a{font-size:13px;color:#0055d4;text-decoration:none;margin:3px 8px 3px 0;display:inline-block}
.toc a:hover{text-decoration:underline}

/* 필터/검색 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.toolbar select,.toolbar input{background:#151c2c;color:#e0e0e0;border:1px solid rgba(0,85,212,0.3);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit}
.toolbar select{min-width:140px}
.toolbar input{flex:1;min-width:200px}
.toolbar .count{font-size:12px;color:#888;margin-left:auto;white-space:nowrap}

/* 유형 헤더 */
.type-header{font-size:20px;font-weight:800;color:#0055d4;padding:12px 0;border-bottom:3px solid #0055d4;margin:32px 0 16px}
.type-header .cnt{font-size:14px;font-weight:400;color:#666}

/* 문제 카드 */
.q-card{background:rgba(0,85,212,0.07);border:1px solid rgba(0,85,212,0.25);border-left:4px solid #0055d4;border-radius:12px;padding:16px 18px;margin-bottom:14px;transition:opacity 0.2s}
.q-card.hidden{display:none}
.q-card .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:4px}
.q-card .qid{font-size:12px;font-weight:700;background:rgba(0,85,212,0.2);color:#60a5fa;padding:2px 8px;border-radius:4px}
.q-card .meta{font-size:11px;color:#666}
.q-card .reviewed{font-size:10px;color:#4ade80;background:rgba(74,222,128,0.15);padding:2px 6px;border-radius:4px;margin-left:6px}
.q-card .unreviewed{font-size:10px;color:#fbbf24;background:rgba(251,191,36,0.15);padding:2px 6px;border-radius:4px;margin-left:6px}
.passage{background:rgba(255,255,255,0.04);border-left:3px solid #0055d4;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.9;color:#cbd5e1;border-radius:0 8px 8px 0;white-space:pre-wrap}
.given-sentence{background:#2a1f00;border-left:3px solid #fbbf24;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.7;color:#fde68a;border-radius:0 8px 8px 0}
.choices{margin:10px 0 6px}
.choices .choice{color:#aaa;font-weight:400;margin:3px 0;font-size:13px}
.choices .choice.correct{color:#4ade80;font-weight:700}
details summary{cursor:pointer;font-size:13px;color:#0055d4;user-select:none;font-weight:600}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▶ '}
details[open] summary::before{content:'▼ '}
.explanation{margin-top:8px;font-size:13px;color:#cbd5e1;line-height:1.8;background:rgba(0,85,212,0.06);padding:12px;border-radius:8px;white-space:pre-wrap}

/* 맨위로 */
.top-btn{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:#0055d4;color:#fff;border:none;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.4);z-index:999}

/* 반응형 */
@media(max-width:600px){
  body{padding:12px}
  h1{font-size:20px}
  .toolbar{flex-direction:column}
  .toolbar select,.toolbar input{width:100%}
  .passage{font-size:13px;padding:10px 12px}
}
</style>
</head><body>

<h1>📘 Prof.AI 수능영어 — 문제은행</h1>
<div class="summary" id="summaryLine"></div>

<div class="toc" id="tocBox">
  <h2>📌 목차 (유형별)</h2>
  <div id="tocLinks"></div>
</div>

<div class="toolbar">
  <select id="filterType"><option value="all">전체 유형</option></select>
  <select id="filterStatus">
    <option value="all">전체 상태</option>
    <option value="reviewed">감수완료</option>
    <option value="unreviewed">미감수</option>
  </select>
  <input type="text" id="searchBox" placeholder="🔍 QID, 지문, 선택지 검색...">
  <span class="count" id="filterCount"></span>
</div>

<div id="questionContainer"></div>

<div style="text-align:center;margin:40px 0 20px;font-size:13px;color:#555" id="footer"></div>

<button class="top-btn" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="questions.js"></script>
<script>
const TYPE_ORDER = ['빈칸 추론','문장 삽입','어법 판단','어휘 적절성','요지/주제','글의 순서','글의 목적','심경 추론','필자의 주장','제목 추론','무관한 문장','요약문 완성'];
const markers = ['①','②','③','④','⑤'];

// 유형별 그룹
function groupByType(questions) {
  const groups = {};
  questions.forEach(q => {
    const t = q._type || q.type || '기타';
    if (!groups[t]) groups[t] = [];
    groups[t].push(q);
  });
  return groups;
}

// 통계
const totalQ = QUESTION_BANK.length;
const reviewedQ = QUESTION_BANK.filter(q => q._reviewed).length;
const noAnswer = QUESTION_BANK.filter(q => !q.answer && q.answer !== 0).length;
document.getElementById('summaryLine').textContent =
  `RPI 공학박사 · 삼성전자/GE 연구원 · 29년 교수 감수 | 총 ${totalQ}문제 | 감수완료 ${reviewedQ} | answer 미설정 ${noAnswer}`;
document.getElementById('footer').textContent =
  `Prof.AI 수능영어 문제은행 · ${totalQ}문제 · ${new Date().getFullYear()}`;

// 목차 & 필터 옵션
const groups = groupByType(QUESTION_BANK);
const tocEl = document.getElementById('tocLinks');
const filterType = document.getElementById('filterType');

TYPE_ORDER.forEach(t => {
  if (!groups[t]) return;
  const anchor = t.replace(/[\/\s]/g, '_');
  const a = document.createElement('a');
  a.href = '#' + anchor;
  a.textContent = `${t} (${groups[t].length})`;
  tocEl.appendChild(a);

  const opt = document.createElement('option');
  opt.value = t;
  opt.textContent = `${t} (${groups[t].length})`;
  filterType.appendChild(opt);
});

// HTML escape
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 카드 렌더
function renderCard(q, idx) {
  const qid = q._qid || q.id || `Q-${idx+1}`;
  const type = q._type || q.type || '';
  const reviewed = q._reviewed;
  const statusBadge = reviewed
    ? '<span class="reviewed">감수완료</span>'
    : '<span class="unreviewed">AI생성</span>';

  let passageHtml = esc(q.passage || '');
  // 밑줄 처리: ①~⑤ 뒤 단어
  passageHtml = passageHtml.replace(/([①②③④⑤])(\s*)([\w''\-]+(?:\s+[\w''\-]+){0,3})/g,
    '<u style="text-decoration:underline;text-underline-offset:3px">$1$2$3</u>');
  // 빈칸
  passageHtml = passageHtml.replace(/___________/g, '<span style="border-bottom:2px solid #60a5fa;padding:0 20px;color:#60a5fa">______</span>');

  let givenHtml = '';
  if (q.given_sentence) {
    givenHtml = `<div class="given-sentence">📌 ${esc(q.given_sentence)}</div>`;
  }

  // 선택지
  let choicesHtml = '';
  if (q.choices && q.choices.length) {
    q.choices.forEach((c, ci) => {
      const isCorrect = (q.answer === ci + 1);
      const cls = isCorrect ? 'choice correct' : 'choice';
      const mark = isCorrect ? '✓ ' : '';
      let text = c.replace(/^[①②③④⑤]\s*/, '').replace(/번\s*표시/g, '').trim();
      if (!text) text = markers[ci];
      choicesHtml += `<div class="${cls}">${mark}${markers[ci]} ${esc(text)}</div>`;
    });
  }

  // 해설
  let explHtml = '';
  if (q.explanation) {
    explHtml = `<details style="margin-top:10px">
<summary>해설 보기</summary>
<div class="explanation">${esc(q.explanation)}</div>
</details>`;
  }

  return `<div class="q-card" id="${qid}" data-type="${type}" data-reviewed="${reviewed ? 1 : 0}" data-text="${esc((q.passage||'')+(q.explanation||'')).toLowerCase()}">
  <div class="header">
    <span><span class="qid">${qid}</span>${statusBadge}</span>
    <span class="meta">${idx+1}번 · ${type}</span>
  </div>
  ${givenHtml}
  <div class="passage">${passageHtml}</div>
  <div class="choices">${choicesHtml}</div>
  ${explHtml}
</div>`;
}

// 전체 렌더
function renderAll() {
  const container = document.getElementById('questionContainer');
  let html = '';
  let idx = 0;

  TYPE_ORDER.forEach(t => {
    if (!groups[t]) return;
    const anchor = t.replace(/[\/\s]/g, '_');
    html += `<div class="type-header" id="${anchor}">${t} <span class="cnt">(${groups[t].length}문제)</span></div>`;
    groups[t].forEach(q => {
      html += renderCard(q, idx);
      idx++;
    });
  });

  // TYPE_ORDER에 없는 유형
  Object.keys(groups).forEach(t => {
    if (TYPE_ORDER.includes(t)) return;
    const anchor = t.replace(/[\/\s]/g, '_');
    html += `<div class="type-header" id="${anchor}">${t} <span class="cnt">(${groups[t].length}문제)</span></div>`;
    groups[t].forEach(q => {
      html += renderCard(q, idx);
      idx++;
    });
  });

  container.innerHTML = html;
}

renderAll();

// 필터 & 검색
const filterStatus = document.getElementById('filterStatus');
const searchBox = document.getElementById('searchBox');
const filterCount = document.getElementById('filterCount');

function applyFilter() {
  const typeVal = filterType.value;
  const statusVal = filterStatus.value;
  const keyword = searchBox.value.toLowerCase().trim();
  const cards = document.querySelectorAll('.q-card');
  const headers = document.querySelectorAll('.type-header');
  let shown = 0;

  cards.forEach(card => {
    const cType = card.dataset.type;
    const cReviewed = card.dataset.reviewed;
    const cText = card.dataset.text + ' ' + card.id.toLowerCase();
    let show = true;
    if (typeVal !== 'all' && cType !== typeVal) show = false;
    if (statusVal === 'reviewed' && cReviewed !== '1') show = false;
    if (statusVal === 'unreviewed' && cReviewed !== '0') show = false;
    if (keyword && !cText.includes(keyword) && !card.id.toLowerCase().includes(keyword)) show = false;
    card.classList.toggle('hidden', !show);
    if (show) shown++;
  });

  // 유형 헤더 표시/숨김
  headers.forEach(h => {
    if (typeVal !== 'all') {
      const hType = h.textContent.split(' (')[0].trim();
      h.style.display = (hType === typeVal) ? '' : 'none';
    } else {
      h.style.display = '';
    }
  });

  filterCount.textContent = `${shown} / ${totalQ}문제`;
}

filterType.addEventListener('change', applyFilter);
filterStatus.addEventListener('change', applyFilter);
searchBox.addEventListener('input', applyFilter);
applyFilter();

// 맨위로 버튼
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll', () => {
  topBtn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
</script>
</body></html>
